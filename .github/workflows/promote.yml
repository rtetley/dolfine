name: Promote to production

# A person either publishes the draft release with "Set as a pre-release" unticked, or later
# unticks it on a published pre-release. Both fire `release: released`, which runs CI on the
# tag and then deploys it to production.

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  deploy-production:
    name: deploy-production
    needs: ci
    permissions:
      contents: read
      deployments: write
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      ref: ${{ github.event.release.tag_name }}
    secrets: inherit
