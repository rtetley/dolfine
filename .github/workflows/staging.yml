name: Deploy to staging

# A person publishes the draft release with "Set as a pre-release" ticked (the default).
# Publishing a draft fires `release: published` (never `prereleased`), so this listens to
# `published` and only runs for pre-releases: CI on the tag, then deploy it to staging.
# A draft published as a full release is handled by promote.yml instead.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    if: github.event.release.prerelease
    uses: ./.github/workflows/ci.yml

  deploy-staging:
    name: deploy-staging
    needs: ci
    permissions:
      contents: read
      deployments: write
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      ref: ${{ github.event.release.tag_name }}
    secrets: inherit
