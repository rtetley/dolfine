name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-release:
    name: pre-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build changelog from PR titles
        id: changelog
        uses: mikepenz/release-changelog-builder-action@b0db9d18b53447ef9f940a46c8f31653c4d9f621 # v6.5.0
        with:
          configuration: .github/changelog-config.json
          mode: PR
          toTag: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pre-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          prerelease: true
          make_latest: false

  # >>> deploy: remove this job if the project has no deploy target yet
  deploy-staging:
    name: deploy-staging
    needs: pre-release
    permissions:
      contents: read
      deployments: write
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      ref: ${{ github.ref_name }}
    secrets: inherit
  # <<< deploy
